<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Employee Management</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body class="login-body">


<div class="login-container">


    <div class="login-card">


        <div class="login-icon">
            👨‍💼
        </div>


        <h1>
            Employee Management
        </h1>


        <p class="login-subtitle">
            Administrator Login
        </p>


        <div
                id="loginMessage"
                class="login-message">
        </div>


        <form
                action="login"
                method="post">


            <div class="login-group">

                <label>
                    Username
                </label>

                <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required>

            </div>


            <div class="login-group">

                <label>
                    Password
                </label>

                <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required>

            </div>


            <button
                    type="submit"
                    class="login-button">

                🔐 Login

            </button>


        </form>


        <div class="login-footer">

            Employee Management System

        </div>


    </div>

</div>


<script>

    const params =
        new URLSearchParams(
            window.location.search
        );

    const error =
        params.get("error");

    const logout =
        params.get("logout");

    const message =
        document.getElementById(
            "loginMessage"
        );


    if (error === "invalid") {

        message.textContent =
            "Invalid username or password.";

        message.classList.add(
            "login-error"
        );

    }


    if (error === "empty") {

        message.textContent =
            "Please enter username and password.";

        message.classList.add(
            "login-error"
        );

    }


    if (error === "database") {

        message.textContent =
            "Database connection error.";

        message.classList.add(
            "login-error"
        );

    }


    if (logout === "true") {

        message.textContent =
            "You have been logged out successfully.";

        message.classList.add(
            "login-success"
        );

    }

</script>


</body>

</html>
